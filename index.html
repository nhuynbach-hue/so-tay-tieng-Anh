<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini quiz · 12 thì tiếng Anh</title>

  <style>
    /* Màu sắc: sửa ở đây để đổi cả trang */
    :root {
      --nen: #f3fbf7;      /* nền trang */
      --chu: #1f3b36;      /* chữ chính */
      --xanh: #10a37a;     /* nút bấm, đáp án được chọn */
      --dung: #12a15c;     /* viền câu đúng */
      --sai: #e5484d;      /* viền câu sai */
    }

    body {
      margin: 0;
      background: var(--nen);
      color: var(--chu);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    /* Khung nội dung, canh giữa */
    main { max-width: 800px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 16px; }

    /* Hộp ghi chú màu vàng */
    .note {
      background: #fff6d6;
      border: 1px solid #ffe08a;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* Mỗi câu hỏi là một khung trắng */
    .question {
      background: white;
      border: 2px solid #d7eee4;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .question.dung { border-color: var(--dung); }
    .question.sai  { border-color: var(--sai); }

    /* Đáp án */
    label {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid #d7eee4;
      border-radius: 10px;
      cursor: pointer;
    }
    label:hover { background: #f3fbf7; }
    label:has(input:checked) { background: #d9f8ec; border-color: var(--xanh); }

    /* Lời giải thích sau khi chấm */
    .giai-thich { margin: 12px 0 0; font-size: 14px; color: #5f7a73; }

    /* Nút bấm */
    button {
      background: var(--xanh);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button.phu { background: white; color: var(--chu); border: 1px solid #d7eee4; }

    /* Khung điểm */
    #ket-qua {
      margin-top: 20px;
      padding: 16px 20px;
      background: #d9f8ec;
      border-radius: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Mini quiz · 10 câu</h1>

    <!-- Ghi chú hướng dẫn: sửa chữ ở đây -->
    <div class="note">
      <strong>Bạn làm gì ở phần này?</strong>
      <ol>
        <li>Đọc từng câu và chọn <b>một</b> đáp án phù hợp nhất.</li>
        <li>Bấm <b>Nộp bài</b> để xem điểm số và lời giải thích.</li>
        <li>Muốn làm lại, bấm <b>Làm lại</b>.</li>
      </ol>
    </div>

    <!-- Câu hỏi sẽ được tạo ra trong khung này -->
    <div id="danh-sach"></div>

    <button id="nut-nop">Nộp bài</button>
    <button id="nut-lam-lai" class="phu" hidden>Làm lại</button>

    <div id="ket-qua" hidden></div>
  </main>

  <script>
    //  =======DỮ LIỆU CÂU HỎI======
    // dung: vị trí đáp án đúng (0 = A, 1 = B, 2 = C, 3 = D)
    // Muốn thêm câu mới: copy một dòng { ... } rồi sửa nội dung.
    const cauHoi = [
      { de: "My brother usually ___ to work by bus.",
        dapAn: ["go", "goes", "is going", "has gone"], dung: 1,
        giaiThich: "“Usually” diễn tả thói quen nên dùng hiện tại đơn. Chủ ngữ “my brother” là ngôi thứ ba số ít nên thêm -es: “goes”." },

      { de: "Look! The children ___ in the garden.",
        dapAn: ["play", "played", "are playing", "have played"], dung: 2,
        giaiThich: "“Look!” cho biết hành động đang diễn ra ngay lúc nói, nên dùng hiện tại tiếp diễn: “are + V-ing”." },

      { de: "We ___ this film three times so far.",
        dapAn: ["see", "saw", "have seen", "are seeing"], dung: 2,
        giaiThich: "“So far” (tính đến nay) thường đi với hiện tại hoàn thành: “have + V3”." },

      { de: "She ___ for two hours, and she still has not finished.",
        dapAn: ["studies", "studied", "has studied", "has been studying"], dung: 3,
        giaiThich: "Hành động kéo dài liên tục đến hiện tại và chưa xong, nhấn vào quá trình: “has been + V-ing”." },

      { de: "They ___ to Da Nang last summer.",
        dapAn: ["go", "have gone", "went", "were going"], dung: 2,
        giaiThich: "“Last summer” là mốc quá khứ đã kết thúc, nên dùng quá khứ đơn. V2 của “go” là “went”." },

      { de: "At 9 p.m. yesterday, I ___ my homework.",
        dapAn: ["did", "was doing", "have done", "will be doing"], dung: 1,
        giaiThich: "Hành động đang diễn ra tại một thời điểm xác định trong quá khứ, nên dùng quá khứ tiếp diễn: “was + V-ing”." },

      { de: "The train ___ before we arrived at the station.",
        dapAn: ["left", "has left", "had left", "was leaving"], dung: 2,
        giaiThich: "Tàu rời đi trước một hành động khác trong quá khứ (we arrived), nên dùng quá khứ hoàn thành: “had + V3”." },

      { de: "By this time next week, we ___ our exams.",
        dapAn: ["finish", "will finish", "will have finished", "will be finishing"], dung: 2,
        giaiThich: "“By this time next week” đặt hạn hoàn tất trước một mốc tương lai, nên dùng tương lai hoàn thành: “will have + V3”." },

      { de: "This time tomorrow, he ___ to Singapore.",
        dapAn: ["flies", "will fly", "will be flying", "has flown"], dung: 2,
        giaiThich: "“This time tomorrow” nói về hành động sẽ đang diễn ra tại một thời điểm tương lai: “will be + V-ing”." },

      { de: "By December, Lisa ___ at this school for five years.",
        dapAn: ["will teach", "will have taught", "will have been teaching", "has been teaching"], dung: 2,
        giaiThich: "Nhấn mạnh khoảng thời gian kéo dài tính đến mốc tương lai (“for five years”): “will have been + V-ing”." }
    ];

    // ===== LẤY CÁC PHẦN TỬ TRÊN TRANG =====
    const danhSach  = document.getElementById("danh-sach");
    const nutNop    = document.getElementById("nut-nop");
    const nutLamLai = document.getElementById("nut-lam-lai");
    const ketQua    = document.getElementById("ket-qua");

    // ===== 1. VẼ CÂU HỎI LÊN TRANG =====
    function veCauHoi() {
      let html = "";

      cauHoi.forEach((cau, i) => {
        // Tạo 4 đáp án (A, B, C, D)
        let dapAnHtml = "";
        cau.dapAn.forEach((chu, j) => {
          const kyHieu = String.fromCharCode(65 + j);   // 0 -> A, 1 -> B...
          dapAnHtml += `
            <label>
              <input type="radio" name="cau${i}" value="${j}"> ${kyHieu}. ${chu}
            </label>`;
        });

        html += `
          <div class="question" id="cau${i}">
            <strong>Câu ${i + 1}.</strong> ${cau.de}
            ${dapAnHtml}
          </div>`;
      });

      danhSach.innerHTML = html;
    }

    // ===== 2. CHẤM BÀI =====
    function chamBai() {
      let soDung = 0;

      cauHoi.forEach((cau, i) => {
        const khung = document.getElementById("cau" + i);
        const daChon = khung.querySelector("input:checked");   // đáp án người dùng chọn (có thể không có)
        const chonDung = daChon && Number(daChon.value) === cau.dung;

        // Xóa lời giải thích cũ (nếu nộp nhiều lần)
        const cu = khung.querySelector(".giai-thich");
        if (cu) cu.remove();

        // Viết lời giải thích mới
        let loiNoi;
        if (chonDung) {
          soDung++;
          loiNoi = "<b>Chính xác!</b> ";
        } else if (!daChon) {
          loiNoi = "<b>Chưa trả lời.</b> ";
        } else {
          loiNoi = "<b>Chưa đúng.</b> ";
        }
        khung.insertAdjacentHTML("beforeend",
          `<p class="giai-thich">${loiNoi}Đáp án đúng: ${cau.dapAn[cau.dung]}. ${cau.giaiThich}</p>`);

        // Tô viền xanh (đúng) hoặc đỏ (sai)
        khung.classList.toggle("dung", chonDung);
        khung.classList.toggle("sai", !chonDung);
      });

      ketQua.textContent = `Điểm của bạn: ${soDung}/${cauHoi.length}`;
      ketQua.hidden = false;
      nutLamLai.hidden = false;
      ketQua.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // ===== 3. LÀM LẠI =====
    function lamLai() {
      veCauHoi();               // vẽ lại câu hỏi (xóa hết đáp án đã chọn)
      ketQua.hidden = true;
      nutLamLai.hidden = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ===== GẮN HÀNH ĐỘNG CHO NÚT =====
    nutNop.addEventListener("click", chamBai);
    nutLamLai.addEventListener("click", lamLai);

    // ===== CHẠY KHI MỞ TRANG =====
    veCauHoi();
  </script>
</body>
</html>
